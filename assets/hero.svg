<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Sagar Chaudhary - Machine Learning Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#140b2e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fade" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <mask id="gridmask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>
  <style>
    .title { font: 800 68px "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 3px; }
    .sub   { font: 500 19px "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace; fill: #9fb3c8; letter-spacing: 1px; }
    .chip  { font: 600 13px "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #e2e8f0; letter-spacing: 1.5px; }
    .tag   { font: 500 12px "JetBrains Mono", "Fira Code", Consolas, monospace; fill: #64748b; letter-spacing: 2px; }
    .orb1 { animation: drift1 16s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 20s ease-in-out infinite alternate; }
    .orb3 { animation: drift3 24s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0,0) } to { transform: translate(140px,50px) } }
    @keyframes drift2 { from { transform: translate(0,0) } to { transform: translate(-120px,-60px) } }
    @keyframes drift3 { from { transform: translate(0,0) } to { transform: translate(60px,-90px) } }
    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { from { transform: translateY(-10px) } to { transform: translateY(430px) } }
    .cursor { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden } }
    .p { animation: floatY 9s ease-in-out infinite; }
    .p2 { animation-duration: 12s; animation-delay: -4s; }
    .p3 { animation-duration: 7s;  animation-delay: -2s; }
    .p4 { animation-duration: 14s; animation-delay: -7s; }
    @keyframes floatY { 0%,100% { transform: translateY(0); opacity: .35 } 50% { transform: translateY(-22px); opacity: .9 } }
    .in { animation: reveal 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: .55s } .d4 { animation-delay: .70s } .d5 { animation-delay: .85s } .d6 { animation-delay: 1s }
    @keyframes reveal { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: translateY(0) } }
    .sweep { animation: sweep 4s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-400px) } to { transform: translateX(1300px) } }
    .ring { transform-origin: 1080px 110px; animation: spin 30s linear infinite; }
    .ring2 { transform-origin: 1080px 110px; animation: spin 45s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)" mask="url(#gridmask)"/>

    <!-- ambient orbs -->
    <circle class="orb1" cx="220" cy="120" r="170" fill="#22d3ee" opacity="0.16" filter="url(#blur)"/>
    <circle class="orb2" cx="980" cy="330" r="210" fill="#a78bfa" opacity="0.16" filter="url(#blur)"/>
    <circle class="orb3" cx="640" cy="60"  r="140" fill="#f472b6" opacity="0.10" filter="url(#blur)"/>

    <!-- orbital rings, top-right -->
    <g class="ring" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.2">
      <circle cx="1080" cy="110" r="58" stroke-dasharray="6 10"/>
      <circle cx="1138" cy="110" r="3.5" fill="#22d3ee" stroke="none"/>
    </g>
    <g class="ring2" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="1.2">
      <circle cx="1080" cy="110" r="84" stroke-dasharray="2 14"/>
      <circle cx="996" cy="110" r="3" fill="#f472b6" stroke="none"/>
    </g>
    <circle class="pulse" cx="1080" cy="110" r="6" fill="#22d3ee" filter="url(#glow)"/>

    <!-- particles -->
    <g fill="#67e8f9">
      <circle class="p"    cx="90"   cy="300" r="2.2"/>
      <circle class="p p2" cx="160"  cy="210" r="1.6"/>
      <circle class="p p3" cx="330"  cy="360" r="1.8"/>
      <circle class="p p4" cx="480"  cy="80"  r="1.4"/>
      <circle class="p p2" cx="760"  cy="350" r="2"/>
      <circle class="p p3" cx="860"  cy="70"  r="1.5"/>
      <circle class="p"    cx="1040" cy="250" r="1.8"/>
      <circle class="p p4" cx="1150" cy="330" r="2.2"/>
    </g>

    <!-- HUD corners -->
    <g fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity=".75" stroke-linecap="round">
      <path d="M30 70 V30 H70"/>
      <path d="M1170 70 V30 H1130"/>
      <path d="M30 350 V390 H70"/>
      <path d="M1170 350 V390 H1130"/>
    </g>
    <text class="tag in d1" x="44" y="404">[ ML // CV // 3D PERCEPTION ]</text>
    <text class="tag in d1" x="1156" y="404" text-anchor="end">BANGALORE, IN</text>
    <text class="tag in d1" x="46" y="46" dominant-baseline="hanging">SYS.ONLINE</text>
    <circle class="pulse" cx="152" cy="53" r="3.5" fill="#34d399"/>

    <!-- scan line -->
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#67e8f9" opacity="0.12"/>

    <!-- headline -->
    <text class="tag in d2" x="600" y="118" text-anchor="middle" style="fill:#7dd3fc">&gt;&gt; hello, world — i am</text>
    <text class="title in d3" x="600" y="190" text-anchor="middle" fill="url(#txt)" filter="url(#glow)">SAGAR CHAUDHARY</text>
    <text class="sub in d4" x="600" y="232" text-anchor="middle">machine learning · computer vision · 3d perception · mlops<tspan class="cursor" fill="#22d3ee">_</tspan></text>

    <!-- chips -->
    <g class="in d5">
      <rect x="292" y="268" width="130" height="34" rx="17" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".6"/>
      <text class="chip" x="357" y="290" text-anchor="middle">PYTORCH</text>
      <rect x="434" y="268" width="176" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-opacity=".6"/>
      <text class="chip" x="522" y="290" text-anchor="middle">LIDAR · 3D DETECTION</text>
      <rect x="622" y="268" width="140" height="34" rx="17" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".6"/>
      <text class="chip" x="692" y="290" text-anchor="middle">MLFLOW · DVC</text>
      <rect x="774" y="268" width="134" height="34" rx="17" fill="#0f172a" stroke="#f472b6" stroke-opacity=".6"/>
      <text class="chip" x="841" y="290" text-anchor="middle">FASTAPI · RAG</text>
    </g>

    <!-- bottom line with sweep -->
    <g class="in d6">
      <rect x="150" y="334" width="900" height="2" fill="url(#line)"/>
      <rect class="sweep" x="150" y="333" width="220" height="4" fill="url(#shine)" opacity=".8"/>
    </g>
  </g>
</svg>
