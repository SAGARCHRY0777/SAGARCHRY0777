# ─────────────────────────────────────────────────────────────────────────────
# 🐍 Contribution Snake
# Renders the contribution graph as an animated snake and publishes the SVGs
# to the `output` branch. README embeds:
#   https://raw.githubusercontent.com/SAGARCHRY0777/SAGARCHRY0777/output/snake.svg
#   https://raw.githubusercontent.com/SAGARCHRY0777/SAGARCHRY0777/output/snake-dark.svg
# No secrets needed — GITHUB_TOKEN is enough.
# ─────────────────────────────────────────────────────────────────────────────
name: 🐍 Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 h (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG / GIF
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#818cf8&color_dots=#e2e8f0,#a5f3fc,#67e8f9,#22d3ee,#0891b2
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#111827,#1e3a5f,#0e7490,#22d3ee,#a5f3fc
            dist/snake.gif?color_snake=#22d3ee&color_dots=#111827,#1e3a5f,#0e7490,#22d3ee,#a5f3fc

      - name: Publish to `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore(snake): refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
