    </linearGradient>
    <linearGradient id="s-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="s-grid" width="32" height="32" patternUnits="userSpaceOnUse">
