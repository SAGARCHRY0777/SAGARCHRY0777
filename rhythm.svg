      <text class="lbl" x="210" y="100.0" text-anchor="middle" style="font-size:10px;fill:#9fb3c8">55</text>
    </g>
    <g>
      <rect x="247" y="92.0" width="30" height="104" rx="7" fill="#0f172a" fill-opacity=".6"/>
      <rect x="247" y="160.8" width="30" height="35.2" rx="7" fill="#22d3ee" opacity=".9">
        <animate attributeName="height" from="0" to="35.2" dur=".8s" begin="0.28s" fill="freeze"/>
        <animate attributeName="y" from="196" to="160.8" dur=".8s" begin="0.28s" fill="freeze"/>
      </rect>
      <text class="lbl" x="262" y="214" text-anchor="middle">THU</text>
      <text class="lbl" x="262" y="152.8" text-anchor="middle" style="font-size:10px;fill:#9fb3c8">22</text>
    </g>
    <g>
      <rect x="299" y="92.0" width="30" height="104" rx="7" fill="#0f172a" fill-opacity=".6"/>
      <rect x="299" y="164.0" width="30" height="32.0" rx="7" fill="#22d3ee" opacity=".9">
        <animate attributeName="height" from="0" to="32.0" dur=".8s" begin="0.35s" fill="freeze"/>
        <animate attributeName="y" from="196" to="164.0" dur=".8s" begin="0.35s" fill="freeze"/>
      </rect>
      <text class="lbl" x="314" y="214" text-anchor="middle">FRI</text>
      <text class="lbl" x="314" y="156.0" text-anchor="middle" style="font-size:10px;fill:#9fb3c8">20</text>
    </g>
    <g>
      <rect x="351" y="92.0" width="30" height="104" rx="7" fill="#0f172a" fill-opacity=".6"/>
      <rect x="351" y="128.8" width="30" height="67.2" rx="7" fill="#a78bfa" opacity=".9">
        <animate attributeName="height" from="0" to="67.2" dur=".8s" begin="0.42s" fill="freeze"/>
        <animate attributeName="y" from="196" to="128.8" dur=".8s" begin="0.42s" fill="freeze"/>
      </rect>
      <text class="lbl" x="366" y="214" text-anchor="middle">SAT</text>
      <text class="lbl" x="366" y="120.8" text-anchor="middle" style="font-size:10px;fill:#9fb3c8">42</text>
