      <rect x="195" y="108.0" width="30" height="88.0" rx="7" fill="#22d3ee" opacity=".9">
        <animate attributeName="height" from="0" to="88.0" dur=".8s" begin="0.21s" fill="freeze"/>
        <animate attributeName="y" from="196" to="108.0" dur=".8s" begin="0.21s" fill="freeze"/>
