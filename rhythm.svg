      <rect x="143" y="140.0" width="30" height="56.0" rx="7" fill="#22d3ee" opacity=".9">
        <animate attributeName="height" from="0" to="56.0" dur=".8s" begin="0.14s" fill="freeze"/>
        <animate attributeName="y" from="196" to="140.0" dur=".8s" begin="0.14s" fill="freeze"/>
      </rect>
